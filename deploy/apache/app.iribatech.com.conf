# Enable:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite ssl headers
#   sudo a2ensite app.iribatech.com
#   sudo certbot --apache -d app.iribatech.com
#
# Next.js listens on 3002 — 3000 is already used by another app on this host.

<VirtualHost *:80>
    ServerName app.iribatech.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 86400
    RequestHeader set X-Forwarded-Proto "http"
    LimitRequestBody 26214400

    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge !

    Alias /uploads /var/www/iribaapp/uploads
    <Directory /var/www/iribaapp/uploads>
        Require all granted
        Options -Indexes
    </Directory>
    ProxyPass /uploads !

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:3001/socket.io/$1 [P,L]

    ProxyPass        /socket.io/ http://127.0.0.1:3001/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:3001/socket.io/

    ProxyPass        /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    ProxyPass        / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    ErrorLog ${APACHE_LOG_DIR}/app-iribatech-error.log
    CustomLog ${APACHE_LOG_DIR}/app-iribatech-access.log combined
</VirtualHost>
