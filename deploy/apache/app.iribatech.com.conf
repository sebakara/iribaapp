# Enable: proxy, proxy_http, proxy_wstunnel, rewrite, ssl, headers
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite ssl headers
#   sudo a2ensite app.iribatech.com
#   sudo certbot --apache -d app.iribatech.com

<VirtualHost *:80>
    ServerName app.iribatech.com
    Redirect permanent / https://app.iribatech.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName app.iribatech.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/app.iribatech.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/app.iribatech.com/privkey.pem
    Include                 /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 86400
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    LimitRequestBody 26214400

    Alias /uploads /var/www/iribaapp/uploads
    <Directory /var/www/iribaapp/uploads>
        Require all granted
        Options -Indexes
    </Directory>
    ProxyPass /uploads !

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:3001/socket.io/$1 [P,L]

    ProxyPass        /socket.io/ http://127.0.0.1:3001/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:3001/socket.io/

    ProxyPass        /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
